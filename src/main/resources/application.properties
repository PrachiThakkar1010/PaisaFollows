spring.application.name=paisafollows

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
app.starting-balance=10000.00
market.provider=simulated

# Treat the market as open even on weekends/nights, so the simulator can be tested any time.
# Set to false when using real prices on a trading day.
market.force-open=true

# Two background threads for scheduled jobs (price ticks + database writes)
spring.task.scheduling.pool.size=2

# Print START/COMMIT/ROLLBACK of every database transaction (TCL demo)
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=DEBUG