<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PaisaFollows · live orders</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
    fieldset { margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; }
    input, select, button { font: inherit; padding: 4px 8px; margin: 2px; }
    #chart { height: 320px; margin: 8px 0 16px; }
    #log { list-style: none; padding: 0; }
    #log li { padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; background: #f3f3f3; }
    #log li.FILLED { background: #e3f6e8; } #log li.CANCELLED, #log li.EXPIRED { background: #fdeaea; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Live orders</h1>

  <fieldset>
    <legend>1. Log in</legend>
    <input id="email" value="demo1@paisafollows.test" size="28">
    <input id="password" type="password" value="password123">
    <button id="loginBtn">Log in &amp; connect</button>
    <span id="status" class="muted">Not connected</span>
  </fieldset>

  <fieldset>
    <legend>2. Stock</legend>
    <input id="symbol" value="RELIANCE" size="12">
    <select id="interval"><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>1d</option></select>
    <button id="chartBtn">Load chart</button>
    <b>Live: ₹<span id="price">–</span></b>
    <div id="chart"></div>
  </fieldset>

  <fieldset>
    <legend>3. Place a waiting order</legend>
    <select id="side"><option>BUY</option><option>SELL</option></select>
    qty <input id="qty" type="number" value="1" min="1" style="width:70px">
    limit ₹<input id="limit" size="10">
    <button id="nearBtn">Limit just past the price</button>
    <button id="placeBtn">Place LIMIT</button>
    <div id="placed" class="muted"></div>
  </fieldset>

  <h2>Notifications <span class="muted">(/user/queue/orders)</span></h2>
  <ul id="log"></ul>

  <script>
    const $ = id => document.getElementById(id);
    let client = null, lastPrice = null, series = null;

    // ---- 1. login (sets the session cookie), then open the WebSocket with that cookie
    $('loginBtn').onclick = async () => {
      const r = await fetch('/api/auth/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value, password: $('password').value })
      });
      if (!r.ok) { $('status').textContent = 'Login failed: ' + (await r.text()); return; }
      const me = await r.json();
      connect(me.email);
      loadChart();
    };

    function connect(email) {
      if (client) client.deactivate();
      client = new StompJs.Client({
        brokerURL: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws',
        reconnectDelay: 3000
      });
      client.onConnect = () => {
        $('status').textContent = 'Connected as ' + email;
        client.subscribe('/user/queue/orders', m => notify(JSON.parse(m.body)));
        client.subscribe('/topic/ticks', m => {
          const q = JSON.parse(m.body);
          if (q.symbol === $('symbol').value.toUpperCase()) {
            lastPrice = Number(q.price);
            $('price').textContent = lastPrice.toFixed(2);
          }
        });
      };
      client.onWebSocketClose = () => { $('status').textContent = 'Disconnected, retrying…'; };
      client.activate();
    }

    function notify(n) {
      const li = document.createElement('li');
      li.className = n.status;
      li.innerHTML = '<b>' + n.status + '</b> · ' + n.side + ' ' + n.quantity + ' ' + n.symbol +
                     ' (' + n.type + ')<br>' + n.message + ' <span class="muted">· ' + n.at + '</span>';
      $('log').prepend(li);
    }

    // ---- 2. candle chart from GET /api/candles
    const chart = LightweightCharts.createChart($('chart'), {
      timeScale: { timeVisible: true, secondsVisible: false }
    });
    series = chart.addCandlestickSeries();

    async function loadChart() {
      const r = await fetch('/api/candles/' + encodeURIComponent($('symbol').value) +
                            '?interval=' + $('interval').value, { credentials: 'same-origin' });
      if (!r.ok) { $('placed').textContent = 'Chart: ' + (await r.text()); return; }
      const data = await r.json();
      // The chart library shows times as UTC, so shift by +5:30 to display IST
      series.setData(data.candles.map(c => ({
        time: c.time + 19800, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
      chart.timeScale().fitContent();
    }
    $('chartBtn').onclick = loadChart;
    setInterval(() => { if (client && client.connected) loadChart(); }, 10000);

    // ---- 3. place a LIMIT order that will wait a few seconds, then fill
    $('nearBtn').onclick = () => {
      if (lastPrice == null) return;
      const factor = $('side').value === 'BUY' ? 0.9995 : 1.0005;   // 0.05% away from the price
      $('limit').value = (Math.round(lastPrice * factor / 0.05) * 0.05).toFixed(2);
    };
    $('placeBtn').onclick = async () => {
      const r = await fetch('/api/orders', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symbol: $('symbol').value, side: $('side').value, type: 'LIMIT',
                               quantity: Number($('qty').value), price: Number($('limit').value) })
      });
      const body = await r.json();
      $('placed').textContent = r.ok ? 'Placed: ' + body.status + ' · ' + body.message + ' · id ' + body.orderId
                                     : 'Refused: ' + body.message;
    };
  </script>
</body>
</html>
